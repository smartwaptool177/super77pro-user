<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Super77Pro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b1a">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/logo-192.png">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/games.css">
</head>
<body>
<div id="app">

 <!-- HOME (Home + Games tabs live here; Wallet and Profile slide over it as panels) -->
 <div id="homeV" class="hv">
  <header class="hb">
   <img class="av" src="assets/logo-192.png" alt="Super77Pro logo" width="44" height="44">
   <div class="who"><b>Super77Pro</b><small>Guest · ID 000000</small></div>
   <div class="wal" title="Virtual test balance">
    <i class="coin" aria-hidden="true"></i>
    <span class="wal-t"><span class="bal" aria-label="Test balance">0</span><small>Test balance</small></span>
    <button class="plus" id="add" aria-label="Add 1,000 test balance"><svg class="ui"><use href="#u-plus"/></svg></button>
   </div>
  </header>

  <main class="hs">
   <section class="ban" aria-label="Test mode notice">
    <span class="gift"><svg class="ui"><use href="#u-shield"/></svg></span>
    <div><b>Test mode</b><small>All coins are virtual and cannot be withdrawn.</small></div>
    <button id="claim">+ ₹1,000</button>
   </section>

   <div class="sh"><h3>Games</h3><small>3 tables</small></div>
   <div class="gm">
    <button class="g wide c1" data-g="slot" aria-label="Play Lucky777">
     <div class="gt"><span class="tagline">Slots</span><h4>Lucky777</h4><small>3 reels · 5 paylines</small><span class="pl">Play</span></div>
     <img class="lg" src="assets/lucky777.webp" alt="" width="138" height="138">
    </button>
    <button class="g c2" data-g="wheel" aria-label="Play Super77Pro fruit wheel">
     <img class="lg" src="assets/super77pro.webp" alt="" width="116" height="116">
     <span class="tagline">Wheel</span><h4>Super77Pro</h4><small>Spin the fruit wheel</small><span class="pl">Play</span>
    </button>
    <button class="g c3" data-g="greedy" aria-label="Play GreedyBaby">
     <img class="lg" src="assets/greedybaby.webp" alt="" width="116" height="116">
     <span class="tagline">Food</span><h4>GreedyBaby</h4><small>Pick your foods</small><span class="pl">Play</span>
    </button>
   </div>

   <div class="sh"><h3>Earn zone</h3><small>Coming soon</small></div>
   <div class="ez">
    <button data-soon aria-disabled="true"><span><svg class="ni"><use href="#n-cal"/></svg></span>Daily tasks<em>Coming soon</em></button>
    <button data-soon aria-disabled="true"><span><svg class="ni"><use href="#n-users"/></svg></span>Refer &amp; earn<em>Coming soon</em></button>
    <button data-soon aria-disabled="true"><span><svg class="ni"><use href="#n-trophy"/></svg></span>Leaderboard<em>Coming soon</em></button>
   </div>
  </main>

  <nav class="nav" aria-label="Main navigation">
   <button class="on" data-t="home" aria-current="page"><span><svg class="ni"><use href="#n-home"/></svg></span>Home</button>
   <button data-t="games"><span><svg class="ni"><use href="#n-games"/></svg></span>Games</button>
   <button data-t="wallet"><span><svg class="ni"><use href="#n-wallet"/></svg></span>Wallet</button>
   <button data-t="profile"><span><svg class="ni"><use href="#n-user"/></svg></span>Profile</button>
  </nav>
 </div>

 <!-- GAME SCREEN -->
 <section class="game" id="gv" aria-label="Game">
  <header class="gh">
   <img id="gl" class="gl" alt="" src="assets/lucky777.webp" width="36" height="36">
   <div class="wal"><i class="coin" aria-hidden="true"></i><span class="bal" aria-label="Test balance">0</span></div>
   <button class="x" id="info" aria-label="Rules and paytable"><svg class="ui"><use href="#u-info"/></svg></button>
   <button class="x" id="sb" aria-label="Sound"><svg class="ui"><use href="#u-sound"/></svg></button>
   <button class="x" id="close" aria-label="Close game"><svg class="ui"><use href="#u-close"/></svg></button>
  </header>
  <div class="gb" id="gb"></div>
 </section>

 <!-- WALLET / PROFILE PANEL -->
 <section class="pv" id="pv" aria-label="Panel">
  <header class="gh">
   <button class="x" id="pc" aria-label="Back to home"><svg class="ui"><use href="#u-back"/></svg></button>
   <h2 id="pt">Wallet</h2>
  </header>
  <div class="gb" id="pb"></div>
 </section>
</div>

<!-- Dialog (confirmations, paytable/rules) -->
<div class="modal" id="modal" hidden>
 <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-t" tabindex="-1">
  <header><h3 id="modal-t"></h3><button class="x sm" id="modal-x" aria-label="Close dialog"><svg class="ui"><use href="#u-close"/></svg></button></header>
  <div class="modal-b" id="modal-b"></div>
  <footer id="modal-f"></footer>
 </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/sprite.js"></script>
<script src="js/core.js"></script>
<script src="js/rules.js"></script>
<script src="js/slot.js"></script>
<script src="js/wheel.js"></script>
<script src="js/greedy.js"></script>
</body>
</html>
