name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Works both when the repo has the normal folder layout AND when the project
      # was uploaded as a single .zip file (e.g. from a phone, which flattens folders).
      - name: Locate project
        run: |
          set -e
          ZIP=$(ls ./*.zip 2>/dev/null | head -n1 || true)
          if [ -n "$ZIP" ] && [ ! -f capacitor.config.json ]; then
            echo "Using project from $ZIP"
            unzip -q -o "$ZIP" -d _src
            DIR=$(dirname "$(find _src -name capacitor.config.json | head -n1)")
          elif [ -f capacitor.config.json ] && [ -d www ]; then
            DIR=.
          else
            echo "::error::No project found. Upload the project .zip to the repo root, or keep the original folders (www/, assets/, capacitor.config.json)."
            exit 1
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"; ls "$DIR"

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build debug APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: super77pro-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
