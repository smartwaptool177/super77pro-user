name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phone uploads flatten folders. If all files sit in the repo root,
      # rebuild the original folder structure here (only if www/ is missing).
      - name: Rebuild folders if flattened
        run: |
          set -e
          if [ -f capacitor.config.json ] && [ -f index.html ] && [ ! -d www ]; then
            echo "Flat layout detected - rebuilding folders"
            mkdir -p www/css www/js www/assets assets
            mv index.html www/
            for f in style.css games.css; do [ -f "$f" ] && mv "$f" www/css/; done
            for f in core.js rules.js slot.js wheel.js greedy.js sprite.js firebase-config.js; do [ -f "$f" ] && mv "$f" www/js/; done
            for f in greedybaby.webp lucky777.webp super77pro.webp logo-192.png; do [ -f "$f" ] && mv "$f" www/assets/; done
            for f in icon-only.png icon-foreground.png splash.png splash-dark.png; do [ -f "$f" ] && mv "$f" assets/; done
            # @capacitor/assets needs these two; fall back to the other copy if one is missing
            [ -f assets/splash-dark.png ] || { [ -f assets/splash.png ] && cp assets/splash.png assets/splash-dark.png; }
            [ -f assets/icon-foreground.png ] || { [ -f assets/icon-only.png ] && cp assets/icon-only.png assets/icon-foreground.png; }
            find www assets -type f | sort
          fi

      - name: Locate project
        run: |
          set -e
          DIR=""
          if [ -f capacitor.config.json ] && [ -d www ]; then
            DIR=.
          fi
          if [ -z "$DIR" ]; then
            CFG=$(find . -maxdepth 3 -name capacitor.config.json -not -path '*/node_modules/*' -not -path './_src/*' | head -n1 || true)
            if [ -n "$CFG" ] && [ -d "$(dirname "$CFG")/www" ]; then
              DIR=$(dirname "$CFG")
            fi
          fi
          if [ -z "$DIR" ]; then
            ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n1 || true)
            if [ -n "$ZIP" ]; then
              echo "Using project from $ZIP"
              unzip -q -o "$ZIP" -d _src
              CFG=$(find _src -name capacitor.config.json -not -path '*/node_modules/*' | head -n1 || true)
              if [ -n "$CFG" ]; then DIR=$(dirname "$CFG"); fi
            fi
          fi
          if [ -z "$DIR" ] || [ ! -d "$DIR/www" ]; then
            echo "::error::No project found (need capacitor.config.json + www/)."
            find . -maxdepth 2 -not -path './.git/*' | head -n 60
            exit 1
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"; ls "$DIR"

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build debug APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install
          npx cap add android
          npx @capacitor/assets generate --android
          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: super77pro-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
