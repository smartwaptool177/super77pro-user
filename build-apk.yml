name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phone uploads flatten folders. If all files sit in the repo root,
      # rebuild the original folder structure here (only if www/ is missing).
      - name: Rebuild folders if flattened
        run: |
          set -e
          if [ -f capacitor.config.json ] && [ -f index.html ] && [ ! -d www ]; then
            echo "Flat layout detected - rebuilding folders"
            mkdir -p www/css www/js www/assets assets
            mv index.html www/
            for f in style.css games.css; do [ -f "$f" ] && mv "$f" www/css/; done
            for f in core.js rules.js slot.js wheel.js greedy.js sprite.js firebase-config.js; do [ -f "$f" ] && mv "$f" www/js/; done
            for f in greedybaby.webp lucky777.webp super77pro.webp logo-192.png; do [ -f "$f" ] && mv "$f" www/assets/; done
            for f in icon-only.png icon-foreground.png splash.png splash-dark.png; do [ -f "$f" ] && mv "$f" assets/; done
            # @capacitor/assets needs these two; fall back to the other copy if one is missing
            [ -f assets/splash-dark.png ] || { [ -f assets/splash.png ] && cp assets/splash.png assets/splash-dark.png; }
            [ -f assets/icon-foreground.png ] || { [ -f assets/icon-only.png ] && cp assets/icon-only.png assets/icon-foreground.png; }
            find www assets -type f | sort
          fi

      - name: Locate project
        run: |
          set -e
          DIR=""
          if [ -f capacitor.config.json ] && [ -d www ]; then
            DIR=.
          fi
          if [ -z "$DIR" ]; then
            CFG=$(find . -maxdepth 3 -name capacitor.config.json -not -path '*/node_modules/*' -not -path './_src/*' | head -n1 || true)
            if [ -n "$CFG" ] && [ -d "$(dirname "$CFG")/www" ]; then
              DIR=$(dirname "$CFG")
            fi
          fi
          if [ -z "$DIR" ]; then
            ZIP=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n1 || true)
            if [ -n "$ZIP" ]; then
              echo "Using project from $ZIP"
              unzip -q -o "$ZIP" -d _src
              CFG=$(find _src -name capacitor.config.json -not -path '*/node_modules/*' | head -n1 || true)
              if [ -n "$CFG" ]; then DIR=$(dirname "$CFG"); fi
            fi
          fi
          if [ -z "$DIR" ] || [ ! -d "$DIR/www" ]; then
            echo "::error::No project found (need capacitor.config.json + www/)."
            find . -maxdepth 2 -not -path './.git/*' | head -n 60
            exit 1
          fi
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"; ls "$DIR"

      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Build debug APK
        run: |
          set -e
          cd "$PROJECT_DIR"
          npm install
          npx cap add android

          # Adaptive icon needs a background layer: create a solid one
          if [ ! -f assets/icon-background.png ]; then
            if command -v convert >/dev/null 2>&1; then
              convert -size 1024x1024 xc:'#001124' assets/icon-background.png
            else
              python3 -c "import zlib,struct;w=h=1024;raw=b''.join(b'\\x00'+b'\\x00\\x11\\x24'*w for _ in range(h));c=lambda t,d:struct.pack('>I',len(d))+t+d+struct.pack('>I',zlib.crc32(t+d)&0xffffffff);open('assets/icon-background.png','wb').write(b'\\x89PNG\\r\\n\\x1a\\n'+c(b'IHDR',struct.pack('>IIBBBBB',w,h,8,2,0,0,0))+c(b'IDAT',zlib.compress(raw))+c(b'IEND',b''))"
            fi
          fi

          npx @capacitor/assets generate --android --iconBackgroundColor '#001124' --iconBackgroundColorDark '#001124' --splashBackgroundColor '#061030' --splashBackgroundColorDark '#061030'

          # Safety net: if the background mipmap still wasn't generated, point the icon XMLs to a plain color
          RES=android/app/src/main/res
          if ! ls $RES/mipmap-*/ic_launcher_background.* >/dev/null 2>&1; then
            echo "ic_launcher_background mipmap missing - patching to color"
            mkdir -p $RES/values
            printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#001124</color>\n</resources>\n' > $RES/values/ic_launcher_background.xml
            sed -i 's#@mipmap/ic_launcher_background#@color/ic_launcher_background#g' $RES/mipmap-anydpi-v26/*.xml
          fi

          npx cap sync android
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: super77pro-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
